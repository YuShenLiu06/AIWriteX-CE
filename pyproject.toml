[project]
name = "ai_write_x"
version = "1.1.5"
description = "ai_write_x using crewAI"
authors = [{ name = "iniwap", email = "iniwaper@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.102.0,<1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
aiwritex-server = "src.ai_write_x.server:run_server"
aiwritex-gui = "src.ai_write_x.main:run"
# 保留历史兼容性
ai_write_x = "src.ai_write_x.main:run"
run_crew = "src.ai_write_x.main:run"
train = "src.ai_write_x.main:train"
replay = "src.ai_write_x.main:replay"
test = "ai_write_x.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
