[project]
name = "aiwritex-cli"
version = "1.0.0"
description = "Lightweight CLI client for AIWriteX server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "websocket-client>=1.7.0",
]

[project.scripts]
aiwritex = "aiwritex_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiwritex_cli"]
